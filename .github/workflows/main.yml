name: "Mend輪詢掃描(old-ts-web) [Windows]"

on:
  workflow_dispatch:

env:
  # ============================================================
  # 憑證：僅這兩個需要設定為 GitHub Secrets
  # ============================================================
  # Mend User Key (Mend Platform -> 右上角帳號 -> Profile -> User Keys)
  MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
  # 組織用 Fine-grained PAT (需 Contents / Metadata / Custom properties 唯讀)
  GITHUB_TOKEN: ${{ secrets.ORG_ACTION_ACCESS_TOKEN }}

  # ============================================================
  # Mend 帳號/組織識別 (非機敏，設為組織或 Repo 的 Actions Variables)
  # 設定位置：Settings -> Secrets and variables -> Actions -> Variables
  # 不寫死在 yaml，日後帳號/組織變動時只改 Variables、不必動 workflow
  # ============================================================
  MEND_EMAIL: ${{ vars.MEND_EMAIL }}
  # Mend Platform -> Administration -> General Configuration -> Organization UUID
  MEND_ORG_UUID: ${{ vars.MEND_ORG_UUID }}
  # Mend CLI 登入用的組織識別。⚠️ 實測必須填 Organization UUID，改填組織名稱
  # (如 GSS_IGS_MEND_POC) 會讓 `mend code` 認證失敗：
  #   Error: Executing <mend code> ... requires to authenticate first
  # 故此處刻意與 MEND_ORG_UUID 取同一個 Variable，兩者不會不同步。
  # 帳號屬多個 org 時必填，否則掃描結果會落到「該帳號上次存取的 org」。
  MEND_ORGANIZATION: ${{ vars.MEND_ORG_UUID }}

  # ============================================================
  # 使用者可調整參數 (放在腳本最上方，方便自行修改)
  # ============================================================

  # [Windows] Mend CLI 與 UA 設定檔路徑
  # 使用單引號，YAML 才不會把反斜線 (\) 當成跳脫字元
  MEND_CLI_PATH: 'C:\mend\mend.exe'
  MEND_UA_PATH: 'C:\mend\wss-unified-agent.txt'

  # ============================================================
  # Mend SAST 掃描效能/超時參數
  # 用途：避免單一大型 legacy repo (如 IG_Backend) 的 Dataflow 分析卡死，
  #       拖垮整個 24 小時 job、進而導致 Upload Artifact 時出現
  #       "403 Forbidden: job is completed" 的問題。
  # 官方文件: https://docs.mend.io/platform/latest/configure-the-mend-cli-for-sast
  # 這些是 Mend CLI 讀取的環境變數 (非 CLI flag)，因為是 workflow 層級的 env，
  # 下面 python 步驟的 os.environ 會自動繼承到，不需要額外傳遞。
  # ============================================================
  # 單一「語言」掃描超時 (分鐘)：超過就跳過該語言、繼續掃下一個，結果為部分掃描 (預設 480 分鐘)
  MEND_SAST_TIMEOUT_LANGUAGE: "960"
  # 單一「檔案」掃描超時 (秒)：超過就跳過該檔案，繼續掃下一個 (預設 Gen2 語言是 600 秒，上限 1800 秒)
  MEND_SAST_TIMEOUT_FILE: "1800"
  # 整個 SAST 掃描的「總超時」(分鐘)：超過會讓 Mend CLI 以 Exit Code 9 結束該次掃描 (預設 480 分鐘)
  # 目前先設 180 分鐘，讓卡住的 repo 掃描能在 3 小時內結束並繼續處理下一個 repo，
  # 之後可依實際 repo 規模與跑幾輪的觀察結果再調整
  MEND_SAST_TIMEOUT_TOTAL: "1440"
  
  # Code Compliance Report (SAST) 使用的合規標準
  # 可選值：Default, OWASP Top 10 2017, OWASP Top 10 2021, OWASP Top 10 2025,
  # PCI DSS, PCI DSS 4.0, NIST, SANS/CWE Top 25, HIPAA, HITRUST, CAPEC, MISRA
  COMPLIANCE_STANDARD: "OWASP Top 10 2025"

  # Code Compliance Report 的詳細程度 (必填欄位)
  # 可選值：technical (完整技術細節) / short / summary (摘要)
  COMPLIANCE_REPORT_LEVEL: "technical"

  # SBOM 報告：reportType 決定輸出的 SBOM 標準 (cycloneDX / spdx 等)，format 決定檔案格式
  SBOM_REPORT_TYPE: "cycloneDX"
  SBOM_FORMAT: "json"

  # Risk Report 格式 (依 Mend Platform UI 固定為 PDF)
  RISK_REPORT_FORMAT: "pdf"

  # Inventory Report 格式：excel / json / xml
  INVENTORY_REPORT_FORMAT: "excel"

  # Due Diligence Report 格式：excel / json / xml (不支援 pdf)
  DUE_DILIGENCE_FORMAT: "json"

  # 部門名稱 如 OLD_TS
  DEPARTMENT: "OLD_TS"

  # Category 前綴對照表 (JSON 格式)
  CATEGORY_GROUPS_JSON: |
    {
      "Api": ["Server(.NET)","Server(Go)"],
      "Server_Web": ["Client(Vue)", "Tool(.NET)", "Package(.NET)", "ServerClient(.Net Framework)", "DLL(.Net Framework)", "Tool(.Net Framework)"]
    }

  # Mend 設定
  MEND_URL: "https://saas.mend.io"
  # Mend AppSec Platform API v3.0 - 統一用來拉 SCA (SBOM/Risk/Inventory/Due Diligence) 與 SAST (Code Compliance) 報告
  MEND_API_URL: "https://api-saas.mend.io/api/v3.0"

  # API 設定
  GITHUB_API: "https://api.github.com"

  # Clone 路徑 (留空的話，程式會自動用 RUNNER_TEMP)
  CLONE_BASE_DIR: ""

  # [優化6] 是否跳過已封存 (archived) 的 repo：true / false
  # 預設 false = 維持原本行為 (封存的 repo 也照樣掃描)；空的 repo (無任何內容) 則一律跳過
  SKIP_ARCHIVED_REPOS: "false"

  # [優化3] 背景處理報告的執行緒數量
  # 掃描完一個 repo 後，報告的產生/輪詢/下載交給背景處理，主程式直接掃下一個 repo
  # 報告輪詢幾乎不吃 CPU；若 Mend API 回應 429 (請求過多) 頻繁，可調降為 1
  REPORT_WORKERS: "2"

jobs:
  run-MendScanRepo:
    runs-on:
      group: devsecops_group # enterprise提供的 runner group
      # [Windows] 若測試用的 Windows runner 不在此 group，請改成對應的 group，
      # 或改用 labels 指定，例如： runs-on: [self-hosted, Windows]
    timeout-minutes: 1440
    env:
      PYTHONUNBUFFERED: 1
      # [Windows] 讓 Python 預設使用 UTF-8，避免系統預設編碼 (cp950) 造成中文亂碼或解碼錯誤
      PYTHONUTF8: 1
      # [Windows] 禁止 git 在認證失敗時跳出互動式登入視窗 (Git Credential Manager)，
      # 否則在 runner 服務中會卡住等待輸入
      GIT_TERMINAL_PROMPT: 0
      GCM_INTERACTIVE: never
    steps:
      # [優化8] 已移除 actions/checkout：腳本直接寫在此 YAML 內，不需要 checkout 本 repo
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run MendScanRepo.py inside workflow
        shell: python
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          MEND_EMAIL: ${{ env.MEND_EMAIL }}
          MEND_USER_KEY: ${{ env.MEND_USER_KEY }}
          MEND_ORG_UUID: ${{ env.MEND_ORG_UUID }}
          MEND_ORGANIZATION: ${{ env.MEND_ORGANIZATION }}
          MEND_URL: ${{ env.MEND_URL }}
          MEND_API_URL: ${{ env.MEND_API_URL }}
          GITHUB_API: ${{ env.GITHUB_API }}
          DEPARTMENT: ${{ env.DEPARTMENT }}
          CLONE_BASE_DIR: ${{ env.CLONE_BASE_DIR }}
          CATEGORY_GROUPS_JSON: ${{ env.CATEGORY_GROUPS_JSON }}
          COMPLIANCE_STANDARD: ${{ env.COMPLIANCE_STANDARD }}
          COMPLIANCE_REPORT_LEVEL: ${{ env.COMPLIANCE_REPORT_LEVEL }}
          SBOM_REPORT_TYPE: ${{ env.SBOM_REPORT_TYPE }}
          SBOM_FORMAT: ${{ env.SBOM_FORMAT }}
          RISK_REPORT_FORMAT: ${{ env.RISK_REPORT_FORMAT }}
          INVENTORY_REPORT_FORMAT: ${{ env.INVENTORY_REPORT_FORMAT }}
          DUE_DILIGENCE_FORMAT: ${{ env.DUE_DILIGENCE_FORMAT }}
          MEND_CLI_PATH: ${{ env.MEND_CLI_PATH }}
          MEND_UA_PATH: ${{ env.MEND_UA_PATH }}
          SKIP_ARCHIVED_REPOS: ${{ env.SKIP_ARCHIVED_REPOS }}
          REPORT_WORKERS: ${{ env.REPORT_WORKERS }}

        run: |
          import os, json, requests, subprocess, shutil, stat, time, sys, signal, threading, re, zipfile, io
          from concurrent.futures import ThreadPoolExecutor

          COMPLIANCE_STANDARD = os.getenv("COMPLIANCE_STANDARD")
          COMPLIANCE_REPORT_LEVEL = os.getenv("COMPLIANCE_REPORT_LEVEL")
          SBOM_REPORT_TYPE = os.getenv("SBOM_REPORT_TYPE")
          SBOM_FORMAT = os.getenv("SBOM_FORMAT")
          RISK_REPORT_FORMAT = os.getenv("RISK_REPORT_FORMAT")
          INVENTORY_REPORT_FORMAT = os.getenv("INVENTORY_REPORT_FORMAT")
          DUE_DILIGENCE_FORMAT = os.getenv("DUE_DILIGENCE_FORMAT")
          MEND_CLI_PATH = os.getenv("MEND_CLI_PATH")
          MEND_UA_PATH = os.getenv("MEND_UA_PATH")
          SKIP_ARCHIVED_REPOS = os.getenv("SKIP_ARCHIVED_REPOS", "false").strip().lower() == "true"
          REPORT_WORKERS = max(1, int(os.getenv("REPORT_WORKERS", "2") or "2"))

          # Mend 後台處理掃描結果的輪詢設定（掃描完到 project 出現在 API 之間的等待）
          PROJECT_WAIT_MAX_RETRIES = 10
          PROJECT_WAIT_INTERVAL_SECONDS = 15

          # 非同步報告的輪詢設定
          # 20 次 x 15 秒 = 5 分鐘太短，實測 SBOM 有時會需要更久才處理完，拉長到 10 分鐘
          # [優化3] 同一個 project 的報告改為「一次全部送出、集中輪詢」，
          #         因此這 10 分鐘是「這一批報告全部」的上限，而不是每份各等 10 分鐘
          REPORT_POLL_MAX_RETRIES = 40
          REPORT_POLL_INTERVAL_SECONDS = 15

          # [優化4] Mend JWT 效期為 30 分鐘，快取 25 分鐘後主動重新登入，保留 5 分鐘安全餘裕
          MEND_JWT_CACHE_SECONDS = 25 * 60

          # [優化4] Mend API 遇到 429 (請求過多) 時的重試設定
          MEND_429_MAX_RETRIES = 5
          MEND_429_WAIT_SECONDS = 30
          # ============================================================

          CANCEL = threading.Event()

          # 強制 stdout/stderr 用 UTF-8，避免 Windows 主機預設編碼 (如 cp950) 造成中文亂碼或解碼錯誤
          try:
              sys.stdout.reconfigure(encoding='utf-8', errors='replace')
              sys.stderr.reconfigure(encoding='utf-8', errors='replace')
          except Exception:
              pass

          def _soft_cancel(signum, frame):
              CANCEL.set()
              try:
                  sys.stdout.reconfigure(encoding='utf-8')
                  sys.stderr.reconfigure(encoding='utf-8')
              except Exception:
                  pass
              print(f"\n[WARN] 收到中斷訊號 ({signum})，將在安全點停止當前掃描並繼續下一個專案。", flush=True)

          signal.signal(signal.SIGINT, _soft_cancel)

          DEPARTMENT = os.getenv("DEPARTMENT", "OLD_TS")
          CLONE_BASE_DIR = os.getenv("CLONE_BASE_DIR") or os.path.join(
              os.getenv("RUNNER_TEMP", os.getcwd()), "MendRepos"
          )
          API = os.getenv("GITHUB_API", "https://api.github.com")
          MEND_URL = os.getenv("MEND_URL", "https://saas.mend.io")
          MEND_API_URL = os.getenv("MEND_API_URL", "https://api-saas.mend.io/api/v3.0")

          GITHUB_TOKEN = os.getenv("GITHUB_TOKEN")
          MEND_EMAIL = os.getenv("MEND_EMAIL")
          MEND_USER_KEY = os.getenv("MEND_USER_KEY")
          MEND_ORG_UUID = os.getenv("MEND_ORG_UUID")
          MEND_ORGANIZATION = os.getenv("MEND_ORGANIZATION")

          CATEGORY_GROUPS_JSON_STR = os.getenv("CATEGORY_GROUPS_JSON", '{}')
          CATEGORY_GROUPS = json.loads(CATEGORY_GROUPS_JSON_STR)

          print("[DEBUG] MEND_USER_KEY present?", "YES" if MEND_USER_KEY else "NO")
          print("[DEBUG] MEND_ORG_UUID present?", "YES" if MEND_ORG_UUID else "NO")
          print("[DEBUG] MEND_EMAIL:", MEND_EMAIL or "(未設定)")
          print("[DEBUG] MEND_ORGANIZATION:", MEND_ORGANIZATION or "(未設定)")
          print("[DEBUG] DEPARTMENT:", DEPARTMENT)
          print("[DEBUG] CATEGORY_GROUPS:", CATEGORY_GROUPS)
          print("[DEBUG] COMPLIANCE_STANDARD:", COMPLIANCE_STANDARD)
          print("[DEBUG] MEND_CLI_PATH:", MEND_CLI_PATH)
          print("[DEBUG] MEND_UA_PATH:", MEND_UA_PATH)

          if not os.path.isfile(MEND_CLI_PATH):
              print(f"[ERROR] 找不到 Mend CLI，請確認這台 runner 上 {MEND_CLI_PATH} 這個檔案存在")
              sys.exit(1)

          # Linux 上檔案存在不代表能執行，確認一下執行權限 (Windows 沒有這個問題，os.access 在 Windows 上一律回 True 不影響)
          if not os.access(MEND_CLI_PATH, os.X_OK):
              print(f"[WARN] {MEND_CLI_PATH} 沒有執行權限，嘗試自動 chmod +x...")
              try:
                  st = os.stat(MEND_CLI_PATH)
                  os.chmod(MEND_CLI_PATH, st.st_mode | 0o111)
              except Exception as e:
                  print(f"[ERROR] chmod 失敗: {e}，請手動執行 chmod +x {MEND_CLI_PATH}")
                  sys.exit(1)

          if not os.path.isfile(MEND_UA_PATH):
              print(f"[ERROR] 找不到 Mend UA Config，請確認這台 runner 上 {MEND_UA_PATH} 這個檔案存在")
              sys.exit(1)

          HEADERS = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          CATEGORY_MAP = {
              key: category
              for category, keys in CATEGORY_GROUPS.items()
              for key in keys
          }


          def detect_project_type(repo_project_type: str) -> str:
              return CATEGORY_MAP.get(repo_project_type, "UNKNOWN")

          # =========================
          # 抓取帳號所屬的所有 org (GitHub)
          # =========================
          # [優化4/6] GitHub API 共用同一個 Session (重用 TCP/TLS 連線)，只在主執行緒使用
          GH_SESSION = requests.Session()
          GH_SESSION.headers.update(HEADERS)


          def _gh_get_all_pages(url: str, params: dict = None) -> list:
              """[優化6] 通用分頁抓取：一直抓到回傳空陣列為止，每次請求都有 timeout"""
              results, page = [], 1
              params = dict(params or {})
              while True:
                  params.update({"per_page": 100, "page": page})
                  resp = GH_SESSION.get(url, params=params, timeout=30)
                  resp.raise_for_status()
                  data = resp.json()
                  if not data:
                      break
                  results.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
              return results


          def get_user_orgs() -> list:
              # [優化6] 原本沒處理分頁，預設只會回 30 筆，org 超過 30 個會漏掃
              return [org["login"] for org in _gh_get_all_pages(f"{API}/user/orgs")]


          def get_org_repos(org: str):
              repos = []
              skipped_empty, skipped_archived = 0, 0
              for r in _gh_get_all_pages(f"{API}/orgs/{org}/repos"):
                  # [優化6] 空的 repo 沒有任何內容，clone/掃描都沒有意義，一律跳過
                  if r.get("size", 0) == 0:
                      skipped_empty += 1
                      continue
                  # [優化6] 依參數決定是否跳過已封存的 repo
                  if SKIP_ARCHIVED_REPOS and r.get("archived"):
                      skipped_archived += 1
                      continue
                  repos.append({"org": org, "name": r["name"], "https_url": r["clone_url"]})
              if skipped_empty or skipped_archived:
                  print(f"[INFO] Org {org} 跳過空 repo {skipped_empty} 個、封存 repo {skipped_archived} 個")
              return repos


          def get_org_repo_properties(org: str):
              """
              [優化6] 用組織層級 API 一次取回整個 org 所有 repo 的 custom properties，
              取代原本「每個 repo 各呼叫一次」的方式。
              GET /orgs/{org}/properties/values
              回傳 {repo_name: {property_name: value}}；若權限不足或不支援則回傳 None，
              呼叫端會自動退回原本的逐一查詢方式。
              """
              try:
                  items = _gh_get_all_pages(f"{API}/orgs/{org}/properties/values")
              except requests.HTTPError as e:
                  status = e.response.status_code if e.response is not None else "?"
                  print(f"[WARN] Org {org} 無法使用組織層級 properties API (status={status})，改為逐一查詢每個 repo")
                  return None
              result = {}
              for item in items:
                  props = {p["property_name"]: p["value"] for p in item.get("properties", [])}
                  result[item["repository_name"]] = props
              return result


          def get_repo_properties(owner: str, repo: str) -> dict:
              # 保留原本的逐一查詢方式，作為組織層級 API 無法使用時的備援
              url = f"{API}/repos/{owner}/{repo}/properties/values"
              resp = GH_SESSION.get(url, timeout=15)
              if resp.status_code == 404:
                  print(f"[WARN] {owner}/{repo} 沒有 custom properties 或無法存取 (404)")
                  return {}
              resp.raise_for_status()
              props = {}
              for item in resp.json():
                  props[item["property_name"]] = item["value"]
              return props


          def on_rm_error(func, path, exc_info):
              os.chmod(path, stat.S_IWRITE)
              func(path)


          def checkout_repo(org: str, repo: str) -> str:
              repo_fullname = f"{org}/{repo}"
              repo_dir = os.path.join(CLONE_BASE_DIR, repo)
              print(f"[INFO] 開始 checkout {repo_fullname} 到 {repo_dir}")

              if os.path.exists(repo_dir):
                  print(f"[WARN] {repo_dir} 已存在，刪除後重新 clone")
                  shutil.rmtree(repo_dir, onerror=on_rm_error)

              # [優化7] 加上 --no-tags，不下載 tag，減少 clone 時間與資料量
              # [Windows] 加上 core.longpaths=true，避免路徑超過 260 字元時 clone 失敗
              #           (前端專案的深層目錄、legacy 專案常見)
              cmd = [
                  "git", "-c", "core.longpaths=true", "clone", "--depth", "1", "--no-tags",
                  f"https://x-access-token:{GITHUB_TOKEN}@github.com/{repo_fullname}.git",
                  repo_dir
              ]
              try:
                  subprocess.run(cmd, check=True, capture_output=True, text=True)
                  print(f"[SUCCESS] {repo_fullname} 已 clone 到 {repo_dir}")
                  return repo_dir
              except subprocess.CalledProcessError as e:
                  print(f"[!] git clone 失敗 (exit code {e.returncode})")
                  print("[STDERR]", e.stderr.strip())
                  # clone 失敗可能留下不完整的資料夾，一併清掉
                  cleanup_repo_dir(repo_dir)
                  raise


          def cleanup_repo_dir(repo_dir: str):
              """[優化7] 掃描完成後立即刪除 clone 目錄 (含 SCA 還原出來的相依套件)，
              避免所有 repo 在 job 結束前一路累積佔滿磁碟。刪除失敗只警告、不中斷流程。"""
              if not repo_dir or not os.path.exists(repo_dir):
                  return
              # [Windows] 掃描程式剛結束時，檔案可能仍被短暫鎖定 (防毒軟體、索引服務、
              #           尚未完全結束的子程序)，因此失敗時等待後重試，最多 3 次
              for attempt in range(1, 4):
                  try:
                      shutil.rmtree(repo_dir, onerror=on_rm_error)
                      print(f"[INFO] 已刪除 clone 目錄: {repo_dir}")
                      return
                  except Exception as e:
                      if attempt < 3:
                          print(f"[WARN] 刪除 clone 目錄失敗 ({attempt}/3)，5 秒後重試: {e}")
                          time.sleep(5)
                      else:
                          print(f"[WARN] 刪除 clone 目錄失敗，請手動清理 ({repo_dir}): {e}")

          # =========================
          # 通用：執行 Mend CLI 指令（mend dep / mend code 共用）
          # =========================
          # 從 Mend CLI 輸出的網址裡擷取 projectUuid，例如:
          # https://saas.mend.io/app/orgs/GSS/applications/summary?project=27677c04-59fb-4efa-8ff3-fc5cfd65e07a
          _PROJECT_UUID_RE = re.compile(r"[?&]project=([0-9a-fA-F-]{36})")

          def run_mend_command(cmd: list, label: str):
              """回傳 (success: bool, project_uuid: str|None)。
              project_uuid 是從 CLI 印出的網址直接擷取，比事後呼叫 API 查詢更可靠。"""
              print(f"[INFO] 執行命令 ({label}): {' '.join(cmd)}")

              env = os.environ.copy()
              env["MEND_URL"] = MEND_URL
              env["MEND_EMAIL"] = MEND_EMAIL
              env["MEND_USER_KEY"] = MEND_USER_KEY
              # 如果 MEND_USER_KEY 對應的帳號屬於多個 org，一定要設這個，
              # 否則掃描結果會跑到「這個帳號上次存取的 org」，在 CI/CD 共用 runner 上不可預期
              if MEND_ORGANIZATION:
                  env["MEND_ORGANIZATION"] = MEND_ORGANIZATION

              p = subprocess.Popen(
                  cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  text=True, encoding="utf-8", errors="replace", bufsize=1, env=env
              )

              rc = None
              found_uuid = None
              try:
                  for line in iter(p.stdout.readline, ''):
                      if CANCEL.is_set():
                          print(f"\n[WARN] 已收到取消旗標，停止 {label} 掃描…", flush=True)
                          break
                      sys.stdout.write(line); sys.stdout.flush()
                      m = _PROJECT_UUID_RE.search(line)
                      if m:
                          found_uuid = m.group(1)

                  if CANCEL.is_set() and p.poll() is None:
                      try: p.terminate()
                      except Exception: pass
                      try: p.wait(timeout=5)
                      except Exception:
                          try: p.kill()
                          except Exception: pass

                  if not CANCEL.is_set():
                      rc = p.wait()
                      if rc == 0:
                          print(f"[SUCCESS] {label} 掃描完成", flush=True)
                      else:
                          print(f"[ERROR] {label} 掃描失敗 (ReturnCode={rc})", flush=True)

              except KeyboardInterrupt:
                  CANCEL.set()
                  print(f"\n[WARN] 收到中斷，停止 {label} 掃描。", flush=True)
                  try: p.terminate()
                  except Exception: pass
                  try: p.wait(timeout=5)
                  except Exception:
                      try: p.kill()
                      except Exception: pass

              finally:
                  try:
                      if p.stdout: p.stdout.close()
                  except Exception:
                      pass

              if CANCEL.is_set():
                  print(f"[SKIP] {label} 已被取消。", flush=True)
                  return False, found_uuid

              return (rc == 0), found_uuid


          def run_mend_sca_scan(project_path, application_name, project_name):
              cmd = [MEND_CLI_PATH, "ua", "-c", MEND_UA_PATH, "-d", project_path, "-product", application_name,
                      "-project", project_name, "-apiKey", MEND_ORGANIZATION, "-userKey", MEND_USER_KEY]
              return run_mend_command(cmd, "SCA")


          def run_mend_sast_scan(project_path, application_name, project_name):
              cmd = [MEND_CLI_PATH, "code", "-d", project_path,
                     "--scope", f"{application_name}//{project_name}", "--non-interactive"]
              return run_mend_command(cmd, "SAST")

          # =========================
          # Mend AppSec Platform API (v3.0) - 統一認證與報告下載
          # 官方文件參考:
          #   SBOM (Dependencies - SCA): https://api-docs.mend.io/platform/3.0/reports/exportsbomreport
          #   Risk Report (Dependencies - SCA): https://api-docs.mend.io/platform/3.0/reports/exportprojectriskreport
          #   Inventory Report (Dependencies - SCA): https://api-docs.mend.io/platform/3.0/reports/exportprojectinventoryreport
          #   Due Diligence Report (Dependencies - SCA): https://api-docs.mend.io/platform/3.0/reports/exportprojectduediligencereport
          #   Code Compliance Report (SAST): https://api-docs.mend.io/platform/3.0/reports/exportcodecompliancereport
          #   Download Report: https://api-docs.mend.io/platform/3.0/reports/downloadreport
          # 認證流程: login (email+userKey+orgUuid) -> refreshToken -> login/accessToken -> jwtToken (30分鐘效期)
          # =========================
          _jwt_state = {"token": None, "expires_at": 0}
          _jwt_lock = threading.Lock()
          _thread_local = threading.local()


          def _mend_session() -> requests.Session:
              """[優化4] 每個執行緒各自使用一個 Session 重用連線 (requests.Session 不保證跨執行緒安全)"""
              s = getattr(_thread_local, "session", None)
              if s is None:
                  s = requests.Session()
                  _thread_local.session = s
              return s


          def _login_mend_platform() -> str:
              login_payload = {"email": MEND_EMAIL, "userKey": MEND_USER_KEY, "orgUuid": MEND_ORG_UUID}
              login_resp = _mend_session().post(f"{MEND_API_URL}/login", json=login_payload, timeout=30)
              login_resp.raise_for_status()
              refresh_token = login_resp.json()["response"]["refreshToken"]

              token_resp = _mend_session().post(
                  f"{MEND_API_URL}/login/accessToken",
                  headers={"wss-refresh-token": refresh_token},
                  params={"orgUuid": MEND_ORG_UUID},
                  json={},
                  timeout=30
              )
              token_resp.raise_for_status()
              return token_resp.json()["response"]["jwtToken"]


          def get_mend_platform_token() -> str:
              """
              [優化4] Token 快取：原本每一次 API 請求 (含每一次輪詢) 都重新登入 2 次，
              改為快取 25 分鐘，到期前才重新登入。加鎖確保多個背景執行緒不會同時重複登入。
              """
              with _jwt_lock:
                  now = time.time()
                  if _jwt_state["token"] and now < _jwt_state["expires_at"]:
                      return _jwt_state["token"]
                  jwt_token = _login_mend_platform()
                  _jwt_state["token"] = jwt_token
                  _jwt_state["expires_at"] = now + MEND_JWT_CACHE_SECONDS
                  print("[INFO] 已取得新的 Mend JWT Token (快取 25 分鐘)", flush=True)
                  return jwt_token


          def _invalidate_mend_token(used_token: str):
              """只清掉「剛剛用過且失效」的 Token，避免把其他執行緒剛換好的新 Token 也清掉"""
              with _jwt_lock:
                  if _jwt_state["token"] == used_token:
                      _jwt_state["token"] = None
                      _jwt_state["expires_at"] = 0


          def mend_request(method: str, url: str, **kwargs) -> requests.Response:
              """
              [優化4] 統一的 Mend API 呼叫入口：
              - 自動帶入快取的 JWT Token
              - 回應 401 (Token 失效) 時，自動重新登入並重試一次
              - 回應 429 (請求過多) 時，等待後重試，最多 MEND_429_MAX_RETRIES 次
              """
              extra_headers = kwargs.pop("headers", None) or {}
              auth_retried = False
              rate_retries = 0
              while True:
                  token = get_mend_platform_token()
                  headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
                  headers.update(extra_headers)
                  resp = _mend_session().request(method, url, headers=headers, **kwargs)

                  if resp.status_code == 401 and not auth_retried:
                      print("[WARN] Mend API 回應 401，Token 可能已失效，重新登入後重試", flush=True)
                      _invalidate_mend_token(token)
                      auth_retried = True
                      continue

                  if resp.status_code == 429 and rate_retries < MEND_429_MAX_RETRIES:
                      rate_retries += 1
                      try:
                          wait = int(resp.headers.get("Retry-After", MEND_429_WAIT_SECONDS))
                      except (TypeError, ValueError):
                          wait = MEND_429_WAIT_SECONDS
                      print(f"[WARN] Mend API 回應 429 (請求過多)，等待 {wait} 秒後重試 ({rate_retries}/{MEND_429_MAX_RETRIES})", flush=True)
                      time.sleep(wait)
                      continue

                  return resp


          def get_project_uuid(application_name: str, project_name: str):
              """
              GET /api/v3.0/orgs/{orgUuid}/projects?filter=name:equals:{project_name}
              比對 applicationName 確保是同一個 Application 底下的 Project
              (SCA 與 SAST 掃描共用同一個 Application//Project scope，所以只需要查一次)
              """
              url = f"{MEND_API_URL}/orgs/{MEND_ORG_UUID}/projects"
              params = {"filter": f"name:equals:{project_name}"}
              resp = mend_request("GET", url, params=params, timeout=30)
              resp.raise_for_status()
              for proj in resp.json().get("response", []):
                  if proj.get("name") == project_name and proj.get("applicationName") == application_name:
                      return proj.get("uuid")
              return None


          def wait_for_project_uuid(application_name: str, project_name: str,
                                     max_retries=PROJECT_WAIT_MAX_RETRIES, wait_seconds=PROJECT_WAIT_INTERVAL_SECONDS):
              for attempt in range(1, max_retries + 1):
                  if CANCEL.is_set():
                      return None
                  project_uuid = get_project_uuid(application_name, project_name)
                  if project_uuid:
                      return project_uuid
                  print(f"[INFO] [{project_name}] Mend 後台尚未處理完成，等待 {wait_seconds} 秒後重試 ({attempt}/{max_retries})...")
                  time.sleep(wait_seconds)
              return None

          # =========================
          # 檔案名稱依副檔名決定（依格式）
          # =========================
          _EXT_MAP = {"json": "json", "xml": "xml", "excel": "xlsx", "pdf": "pdf"}

          def _ext_for(fmt: str) -> str:
              return _EXT_MAP.get(fmt, fmt)

          # =========================
          # [優化3] 報告處理：拆成「送出 / 查詢狀態 / 下載」三個動作，
          # 讓同一個 project 的所有報告可以一次全部送出、集中輪詢
          # =========================
          def submit_v3_report(create_path: str, payload: dict, label: str):
              resp = mend_request("POST", f"{MEND_API_URL}/{create_path}", json=payload, timeout=60)
              if resp.status_code not in (200, 201, 202):
                  print(f"[ERROR] 建立 {label} 失敗，status={resp.status_code}, body={resp.text[:300]}")
                  return None
              report_uuid = resp.json().get("response", {}).get("uuid")
              if not report_uuid:
                  print(f"[ERROR] 無法取得 {label} 的 report uuid: {resp.text[:300]}")
                  return None
              print(f"[INFO] {label} 已送出產生請求")
              return report_uuid


          def get_v3_report_status(report_uuid: str):
              resp = mend_request("GET", f"{MEND_API_URL}/orgs/{MEND_ORG_UUID}/reports/{report_uuid}", timeout=30)
              resp.raise_for_status()
              return resp.json().get("response", {}).get("status")


          def download_v3_report(report_uuid: str, output_path: str, label: str, expected_format: str = None) -> bool:
              dresp = mend_request("GET", f"{MEND_API_URL}/orgs/{MEND_ORG_UUID}/reports/download/{report_uuid}", timeout=120)
              if dresp.status_code != 200:
                  print(f"[ERROR] {label} 下載失敗，status={dresp.status_code}")
                  return False

              content_type = dresp.headers.get("Content-Type", "")
              content = dresp.content
              print(f"[INFO] {label} 下載回應 Content-Type: {content_type}, 大小: {len(content)} bytes")

              if content[:2] == b"PK":
                  try:
                      with zipfile.ZipFile(io.BytesIO(content)) as zf:
                          file_names = [n for n in zf.namelist() if not n.endswith("/")]
                          expected_ext = "." + _ext_for(expected_format) if expected_format else None
                          matches = [n for n in file_names if expected_ext and n.lower().endswith(expected_ext)]

                          if len(matches) == 1:
                              inner_name = matches[0]
                          elif len(file_names) == 1:
                              inner_name = file_names[0]
                          else:
                              inner_name = None

                          if inner_name:
                              print(f"[INFO] {label} 下載回來的是外層包裝 zip，正在解壓縮...")
                              content = zf.read(inner_name)
                              print(f"[INFO] {label} 從 zip 解出: {inner_name} ({len(content)} bytes)")
                          else:
                              print(f"[INFO] {label} 內容本身就是多檔案的 zip 格式 (例如 xlsx)，不需要解包，共 {len(file_names)} 個項目")
                  except zipfile.BadZipFile:
                      print(f"[ERROR] {label} 開頭是 PK 但不是合法的 zip 檔案")
                      return False

              # 針對 pdf 格式做內容驗證：真正的 PDF 檔案一定是 %PDF 開頭
              if expected_format == "pdf" and not content.startswith(b"%PDF"):
                  preview = content[:500].decode("utf-8", errors="replace")
                  print(f"[ERROR] {label} 下載回來的內容不是有效的 PDF，可能是 API 回傳了錯誤訊息:")
                  print(f"[ERROR] 內容前 500 字元: {preview}")
                  return False

              # 針對非 pdf 格式：如果內容看起來像 JSON 錯誤物件 (帶 errorMessage 等欄位) 就攔下來
              if expected_format and expected_format != "pdf" and expected_format != "json":
                  stripped = content[:1].decode("utf-8", errors="ignore")
                  if stripped == "{":
                      preview = content[:500].decode("utf-8", errors="replace")
                      print(f"[WARN] {label} 預期是 {expected_format} 格式，但下載內容看起來像 JSON，請人工確認:")
                      print(f"[WARN] 內容前 500 字元: {preview}")

              with open(output_path, "wb") as f:
                  f.write(content)
              print(f"[SUCCESS] {label} 已下載: {output_path}")
              return True


          def build_report_jobs(project_uuid: str, project_report_dir: str, sca_ok: bool, sast_ok: bool) -> list:
              """依掃描結果決定要產生哪些報告 (與原本的判斷邏輯相同：SCA 成功才產 4 份 SCA 報告，SAST 成功才產合規報告)"""
              jobs = []
              if sca_ok:
                  jobs.append({
                      "key": "sbom", "label": "SBOM", "format": SBOM_FORMAT,
                      "create_path": f"projects/{project_uuid}/dependencies/reports/SBOM",
                      "payload": {"name": "SBOM Report", "format": SBOM_FORMAT, "reportType": SBOM_REPORT_TYPE},
                      "path": os.path.join(project_report_dir, f"SBOM.{_ext_for(SBOM_FORMAT)}"),
                  })
                  jobs.append({
                      "key": "risk_report", "label": "Risk Report", "format": RISK_REPORT_FORMAT,
                      "create_path": f"projects/{project_uuid}/dependencies/reports/risk",
                      "payload": {"name": "Risk Report", "format": RISK_REPORT_FORMAT, "exportMode": "fullPdf"},
                      "path": os.path.join(project_report_dir, f"RISK_REPORT.{_ext_for(RISK_REPORT_FORMAT)}"),
                  })
                  jobs.append({
                      "key": "inventory_report", "label": "Inventory Report", "format": INVENTORY_REPORT_FORMAT,
                      "create_path": f"projects/{project_uuid}/dependencies/reports/inventory",
                      "payload": {"name": "Inventory Report", "format": INVENTORY_REPORT_FORMAT},
                      "path": os.path.join(project_report_dir, f"INVENTORY_REPORT.{_ext_for(INVENTORY_REPORT_FORMAT)}"),
                  })
                  jobs.append({
                      "key": "due_diligence_report", "label": "Due Diligence Report", "format": DUE_DILIGENCE_FORMAT,
                      "create_path": f"projects/{project_uuid}/dependencies/reports/dueDiligence",
                      "payload": {"name": "Due Diligence Report", "format": DUE_DILIGENCE_FORMAT},
                      "path": os.path.join(project_report_dir, f"DUE_DILIGENCE_REPORT.{_ext_for(DUE_DILIGENCE_FORMAT)}"),
                  })
              if sast_ok:
                  jobs.append({
                      "key": "code_compliance_report", "label": "Code Compliance Report", "format": "pdf",
                      "create_path": f"projects/{project_uuid}/code/reports/compliance",
                      "payload": {
                          "name": "Code Compliance Report",
                          "format": "pdf",
                          "exportMode": "fullPdf",
                          "complianceStandard": COMPLIANCE_STANDARD,
                          "reportLevel": COMPLIANCE_REPORT_LEVEL
                      },
                      "path": os.path.join(project_report_dir, "CODE_COMPLIANCE_REPORT.pdf"),
                  })
              return jobs


          def generate_reports_batch(jobs: list, log_prefix: str) -> dict:
              """
              [優化3] 第一層：同一個 project 的報告「一次全部送出」，再「集中輪詢」。
              原本是送一份→等完成→下載→再送下一份 (最差 5 x 10 分鐘)，
              改為讓 Mend 後端同時處理，等待時間變成「最慢的那一份」。
              另外，查詢狀態時若遇到暫時性錯誤，不會直接放棄該報告，下一輪會再試。
              回傳 {report_key: 檔案路徑}
              """
              done = {}
              pending = []
              for job in jobs:
                  label = f"{log_prefix} {job['label']}"
                  try:
                      report_uuid = submit_v3_report(job["create_path"], job["payload"], label)
                  except Exception as e:
                      print(f"[ERROR] {label} 送出時發生例外: {e}")
                      report_uuid = None
                  if report_uuid:
                      pending.append({**job, "label": label, "report_uuid": report_uuid})

              for attempt in range(1, REPORT_POLL_MAX_RETRIES + 1):
                  if not pending or CANCEL.is_set():
                      break
                  still_pending = []
                  for job in pending:
                      try:
                          status = get_v3_report_status(job["report_uuid"])
                      except Exception as e:
                          print(f"[WARN] {job['label']} 查詢狀態失敗: {e}，下一輪再試")
                          still_pending.append(job)
                          continue

                      print(f"[INFO] {job['label']} 狀態: {status} ({attempt}/{REPORT_POLL_MAX_RETRIES})")
                      if status == "SUCCESS":
                          try:
                              if download_v3_report(job["report_uuid"], job["path"], job["label"], expected_format=job["format"]):
                                  done[job["key"]] = job["path"]
                          except Exception as e:
                              print(f"[ERROR] {job['label']} 下載時發生例外: {e}")
                      elif status in ("FAILED", "FAILURE"):
                          print(f"[ERROR] {job['label']} 產生失敗")
                      else:
                          still_pending.append(job)

                  pending = still_pending
                  if pending:
                      time.sleep(REPORT_POLL_INTERVAL_SECONDS)

              for job in pending:
                  if CANCEL.is_set():
                      print(f"[SKIP] {job['label']} 已被取消")
                  else:
                      print(f"[ERROR] {job['label']} 輪詢逾時")
              return done


          def process_project_reports(record: dict, sca_uuid, sast_uuid, project_report_dir: str):
              """
              [優化3] 第二層：此函式在「背景執行緒」執行。
              掃描完成後主程式把報告工作交給背景，自己直接去 clone / 掃描下一個 repo，
              報告的等待時間 (純輪詢，幾乎不耗 CPU) 就和下一個 repo 的掃描重疊。
              """
              application_name = record["application"]
              project_name = record["project"]
              prefix = f"[{project_name}]"
              try:
                  # 優先用掃描時直接從 CLI 輸出擷取到的 projectUuid（比事後查 API 更可靠）
                  project_uuid = sca_uuid or sast_uuid
                  if not project_uuid:
                      print(f"[INFO] {prefix} 掃描輸出裡沒擷取到 projectUuid，改用 API 查詢 fallback")
                      project_uuid = wait_for_project_uuid(application_name, project_name)

                  if not project_uuid:
                      print(f"[WARN] {prefix} 找不到 {application_name}//{project_name} 的 projectUuid，略過報告下載")
                      return

                  jobs = build_report_jobs(project_uuid, project_report_dir, record["sca_success"], record["sast_success"])
                  record["reports"].update(generate_reports_batch(jobs, prefix))
                  print(f"[INFO] {prefix} 報告處理完成：成功 {len(record['reports'])} / {len(jobs)} 份")
              except Exception as e:
                  print(f"[!] {prefix} 處理報告時發生例外: {e}")

          # =========================
          # 主程式
          # =========================
          def main():
              all_orgs = get_user_orgs()
              print(f"[INFO] 找到 {len(all_orgs)} 個 org: {all_orgs}")

              results = []
              reports_root = os.path.join(os.getcwd(), "Reports")
              os.makedirs(reports_root, exist_ok=True)

              # [優化3] 報告背景處理用的執行緒池
              report_pool = ThreadPoolExecutor(max_workers=REPORT_WORKERS, thread_name_prefix="report")
              report_futures = []

              try:
                  for org in all_orgs:
                      if CANCEL.is_set():
                          break

                      repos = get_org_repos(org)
                      print(f"[INFO] Org {org} 有 {len(repos)} 個 repo")

                      # [優化6] 一次取回整個 org 的 custom properties；失敗時為 None，改逐一查詢
                      org_props = get_org_repo_properties(org)

                      for repo in repos:
                          if CANCEL.is_set():
                              print("[WARN] 已收到取消旗標，停止處理後續 repo。")
                              break

                          github_org = repo["org"]
                          github_repo = repo["name"]

                          print(f"\n[INFO] ========== 處理 Repository: {github_org}/{github_repo} ==========")

                          if org_props is not None:
                              props = org_props.get(github_repo, {})
                          else:
                              props = get_repo_properties(github_org, github_repo)
                          repo_project_type = props.get("category") or "UNKNOWN"
                          print(f"[INFO] category: {repo_project_type}")

                          project_type_for_mend = detect_project_type(repo_project_type)
                          if project_type_for_mend == "UNKNOWN":
                              print(f"[WARN] {github_org}/{github_repo} 沒有設定 category 或不在對照表中，跳過")
                              continue

                          application_name = f"{DEPARTMENT}_{project_type_for_mend}"
                          project_name = github_repo
                          print(f"[INFO] Mend 對應 -> Application: {application_name} / Project: {project_name}")

                          # 每個 project 一個資料夾: Reports/{project_name}/
                          project_report_dir = os.path.join(reports_root, project_name)
                          os.makedirs(project_report_dir, exist_ok=True)

                          record = {
                              "repo": f"{github_org}/{github_repo}",
                              "application": application_name,
                              "project": project_name,
                              "sca_success": False,
                              "sast_success": False,
                              "reports": {}
                          }
                          results.append(record)

                          sca_uuid, sast_uuid = None, None
                          project_path = None
                          try:
                              project_path = checkout_repo(github_org, github_repo)

                              sca_ok, sca_uuid = run_mend_sca_scan(project_path, application_name, project_name)
                              record["sca_success"] = sca_ok

                              sast_ok, sast_uuid = run_mend_sast_scan(project_path, application_name, project_name)
                              record["sast_success"] = sast_ok

                          except Exception as e:
                              print(f"[!] 處理 {github_org}/{github_repo} 時發生例外: {e}")

                          finally:
                              # [優化7] 掃描一結束 (不論成功或失敗) 就刪除 clone 目錄，
                              # 報告是從 Mend 雲端產生下載，不需要保留原始碼
                              cleanup_repo_dir(project_path)

                          if (record["sca_success"] or record["sast_success"]) and not CANCEL.is_set():
                              # [優化3] 報告交給背景執行緒，主程式直接處理下一個 repo
                              print(f"[INFO] [{project_name}] 報告產生與下載已交由背景處理，繼續下一個 repo")
                              report_futures.append(
                                  report_pool.submit(process_project_reports, record, sca_uuid, sast_uuid, project_report_dir)
                              )

              finally:
                  # 等待所有背景報告工作完成
                  if report_futures:
                      print(f"\n[INFO] 所有 repo 掃描結束，等待背景報告處理完成 (共 {len(report_futures)} 個 project)...")
                  report_pool.shutdown(wait=True)

                  # [優化8] 彙總結果寫到 Reports/ 底下，才會跟著 artifact 一起上傳保存
                  #         放在 finally 內：即使中途發生例外，已處理的結果仍會寫出
                  summary_path = os.path.join(reports_root, "mend_scan_results.json")
                  with open(summary_path, "w", encoding="utf-8") as f:
                      json.dump(results, f, indent=2, ensure_ascii=False)

                  total = len(results)
                  sca_cnt = sum(1 for r in results if r["sca_success"])
                  sast_cnt = sum(1 for r in results if r["sast_success"])
                  print(f"[INFO] 彙總：處理 {total} 個 project，SCA 成功 {sca_cnt}，SAST 成功 {sast_cnt}")
                  print(f"[INFO] 所有結果已寫入 {summary_path}")

          if __name__ == "__main__":
              main()

      - name: Upload Reports to Artifacts
        # [優化8] 加上 if: always()，即使掃描步驟失敗或被取消，已產出的報告與彙總結果仍會上傳
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GSS_Report
          path: Reports/**
